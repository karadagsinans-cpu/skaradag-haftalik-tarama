name: Skaradag Haftalik BIST Taramasi

on:
  schedule:
    # Her Cuma UTC 15:30 (Türkiye Saati ile Cuma 18:30)
    - cron: '30 15 * * 5'
  workflow_dispatch: # İstediğiniz an elle tetiklemek için

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Skaradag Taramasını Çalıştır
        run: python skaradag_scanner.py
